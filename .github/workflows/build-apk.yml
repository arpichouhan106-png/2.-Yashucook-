name: Build Yashucook APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Capacitor & Build Web
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --legacy-peer-deps
          npx cap add android
          npx cap sync
      - name: Fix Kotlin & Build Android APK
        run: |
          echo 'configurations.all { resolutionStrategy { force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22", "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22", "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22" } }' >> android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload Yashucook APK
        uses: actions/upload-artifact@v4
        with:
          name: Yashucook-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
